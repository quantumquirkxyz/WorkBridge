name: skill-performance-metrics
description: "Summarize Skill execution duration, success rate, and available run evidence — use when measuring Skill performance from logs and records."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-performance-metrics
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
