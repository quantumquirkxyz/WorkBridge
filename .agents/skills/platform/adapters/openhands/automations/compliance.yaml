name: compliance
description: "Compliance (SOC2, ISO27001, GDPR, HIPAA, PCI DSS, audits, evidence, remediation)"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/sec-compliance
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
