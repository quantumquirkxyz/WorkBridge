name: skill-diff-analyzer
description: "Compare Skill versions and explain contract, dependency, and behavior impact — use when assessing changes between two Skills."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-diff-analyzer
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
