name: astro
description: "Astro framework (islands architecture, content-focused sites, SSR/SSG, view transitions)."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/frontend-astro
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
