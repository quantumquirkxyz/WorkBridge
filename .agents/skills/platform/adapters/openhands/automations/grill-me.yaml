name: grill-me
description: A relentless interview to sharpen a plan or design.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-grill-me
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
