name: cs-data-structures
description: "Design and analyze data structures — arrays, trees, heaps, hash tables, graphs, and balanced variants — with operation costs and invariants."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cs-cs-data-structures
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
