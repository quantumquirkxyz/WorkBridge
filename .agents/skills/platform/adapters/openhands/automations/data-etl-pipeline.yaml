name: data-etl-pipeline
description: "Design ETL / ELT pipelines — extraction, transformation, load — with reproducible steps, schema evolution, quality checks, and observability."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-data-etl-pipeline
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
