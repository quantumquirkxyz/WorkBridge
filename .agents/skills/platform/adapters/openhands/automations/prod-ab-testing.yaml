name: prod-ab-testing
description: "Design A/B tests — hypothesis, control/treatment, randomization, metrics, statistical power, duration — with valid inference and rollback rules."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/product-prod-ab-testing
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
