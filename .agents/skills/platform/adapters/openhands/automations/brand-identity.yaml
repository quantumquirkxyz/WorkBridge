name: brand-identity
description: "Design brand identity systems — logo, color, typography, imagery, iconography, voice, and usage rules — with explicit consistency, scalability, and governance."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/graphic-design-brand-identity
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
