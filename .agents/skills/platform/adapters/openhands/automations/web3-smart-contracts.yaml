name: web3-smart-contracts
description: "Design and review smart contracts — security, gas optimization, upgradeability, account abstraction, EIP-7702 — with an adversarial review step."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/web3-web3-smart-contracts
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
