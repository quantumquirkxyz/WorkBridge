name: quant-factors
description: "Define, test, and stress-test a quantitative factor (momentum, value, carry, quality) with explicit universe, signal, weighting, and statistical checks."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/quant-quant-factors
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
