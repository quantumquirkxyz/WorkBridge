name: llm-eval
description: "Design LLM evaluation harnesses — benchmark design, model comparison, automated evals — with reproducible scoring, confidence intervals, and regression detection."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-llm-eval
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
