name: backup-disaster-recovery
description: "Design backup and disaster recovery — RPO/RTO, backup strategies, restore testing, cross-region — with explicit recovery objectives and validation."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-backup-disaster-recovery
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
