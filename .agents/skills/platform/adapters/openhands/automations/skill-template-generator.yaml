name: skill-template-generator
description: "Generate an interactive, contract-complete Skill template in the sandbox — use when starting a new Skill with the lab's scaffolding."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-template-generator
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-files]
