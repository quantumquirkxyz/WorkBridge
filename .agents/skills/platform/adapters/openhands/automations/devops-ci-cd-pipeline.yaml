name: devops-ci-cd-pipeline
description: "Design CI/CD pipelines — build, test, security scan, deploy, rollback — with reproducible steps, environment parity, and deployment gates."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-devops-ci-cd-pipeline
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
