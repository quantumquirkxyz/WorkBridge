name: research
description: Investigate a question against high-trust primary sources and capture the findings as a Markdown file in the repo. Use w
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-research
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-docs]
