name: data-quality
description: "Design data quality frameworks — Great Expectations, Soda, checks, observability, contracts — with explicit SLAs, freshness rules, and incident response for bad data."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-data-quality
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
