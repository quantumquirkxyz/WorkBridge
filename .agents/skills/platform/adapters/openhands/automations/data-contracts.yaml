name: data-contracts
description: "Design data contracts — schema evolution, producer-consumer agreements, schema registry, breaking change detection — with explicit compatibility rules and versioning."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-data-contracts
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
