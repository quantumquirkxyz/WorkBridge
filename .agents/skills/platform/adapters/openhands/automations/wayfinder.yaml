name: wayfinder
description: "Plan a huge chunk of work — more than one agent session can hold — as a map of decision tickets on your issue tracker, with staged decomposition and durable scope boundaries."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-wayfinder
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
