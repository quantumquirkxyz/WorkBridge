name: webapp-testing
description: "Choose the right test seam for a web app and describe how to verify it at unit, integration, and end-to-end levels."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-webapp-testing
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
