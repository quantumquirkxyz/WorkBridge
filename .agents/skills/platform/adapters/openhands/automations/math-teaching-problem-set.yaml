name: math-teaching-problem-set
description: "Design and grade math problem sets and exams — difficulty progression, rubric, anti-cheating variants, accessibility, and LaTeX layout."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/math-math-teaching-problem-set
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
