name: agent-canvas
description: "Reference skill for agent workspace control — multi-agent session management, workspace persistence, and cross-device continuity, independent of any external framework."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-agent-canvas
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
