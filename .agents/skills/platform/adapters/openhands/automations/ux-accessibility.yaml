name: ux-accessibility
description: "Design accessible UX — keyboard navigation, focus order, semantics, contrast, and assistive-technology support — with inclusive interaction patterns."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ux-ux-accessibility
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
