name: math-probability-models
description: "Build probability models — distributions, stochastic processes (Markov, Brownian, Poisson), inference — with explicit assumptions and sanity checks."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/math-math-probability-models
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
