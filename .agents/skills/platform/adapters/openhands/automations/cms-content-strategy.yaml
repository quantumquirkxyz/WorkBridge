name: cms-content-strategy
description: "Design CMS content strategy — content models, taxonomy, governance, lifecycle, and multi-channel publishing — with explicit editorial ownership."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cms-cms-content-strategy
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
