name: os-memory
description: "Design operating system memory systems — virtual memory, paging, allocation, swapping, and protection — with explicit resource accounting and locality assumptions."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/os-os-memory
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
