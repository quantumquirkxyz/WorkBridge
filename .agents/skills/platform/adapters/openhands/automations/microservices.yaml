name: microservices
description: "Design microservice architectures — service decomposition, inter-service communication, data ownership, resilience patterns — with explicit boundaries and failure isolation."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/backend-microservices
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
