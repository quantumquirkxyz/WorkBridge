name: db-query-optimization
description: "Optimize database queries — indexing, query plans, cardinality, joins, and execution trade-offs — with explainable reasoning and measurement."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/db-db-query-optimization
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
