name: cs-algorithms
description: "Design and analyse algorithms — correctness proof, complexity analysis (time and space), and stability — with explicit proof of invariants and termination."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cs-cs-algorithms
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
