name: rate-limiting
description: "Rate limiting and throttling (token bucket, sliding window, distributed rate limiting, API protection)."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/backend-rate-limiting
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
