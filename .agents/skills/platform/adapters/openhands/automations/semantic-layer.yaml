name: semantic-layer
description: "Design a semantic layer — dbt, Cube, metrics, dimensions, measures, self-service analytics — with explicit business logic, governance, and query optimization."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-semantic-layer
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
