name: llmops
description: "LLMOps (deployment, monitoring, A/B testing, prompt management, cost optimization, evaluation pipelines)"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-llmops
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
