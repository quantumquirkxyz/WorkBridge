name: compilers
description: "Design and implement compilers and interpreters — lexer, parser, AST, type checking, code generation, optimization — with correctness and modularity."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/compilers-compilers
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
