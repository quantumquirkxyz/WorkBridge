name: tdd
description: "Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-tdd
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
