name: to-tickets
description: "Break a plan, spec, or the current conversation into a set of tracer-bullet tickets, each declaring its blocking edges, and publish the smallest claimable slices."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/project-to-tickets
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [create-issues, write-files]
