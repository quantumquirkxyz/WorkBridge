name: prototype
description: Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or interaction shape actually works.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-prototype
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
