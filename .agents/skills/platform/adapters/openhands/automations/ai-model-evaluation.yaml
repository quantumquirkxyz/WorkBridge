name: ai-model-evaluation
description: "Evaluate ML / LLM models — accuracy, fairness, robustness, explainability, drift — with explicit metrics, subgroup analysis, and failure-mode reporting."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-ai-model-evaluation
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
