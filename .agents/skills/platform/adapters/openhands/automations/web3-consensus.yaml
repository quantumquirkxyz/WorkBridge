name: web3-consensus
description: "Analyse and compare consensus mechanisms — PoW, PoS, BFT, DA, based sequencing — with security properties, finality guarantees, MEV, and economic incentive alignment."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/web3-web3-consensus
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
