name: api-contracts
description: "Define the request and response contracts, versioning rules, compatibility boundaries, OpenAPI/JSON Schema, and breaking change detection for APIs — with explicit consumer obligations."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/integrations-api-contracts
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
