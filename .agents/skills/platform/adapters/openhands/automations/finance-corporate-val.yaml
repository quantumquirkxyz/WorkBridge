name: finance-corporate-val
description: "Corporate valuation — DCF, multiples, sum-of-parts, scenario analysis — with explicit assumptions, sensitivity, and cross-checks."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/finance-finance-corporate-val
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
