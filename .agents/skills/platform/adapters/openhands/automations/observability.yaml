name: observability
description: "Define the logs, metrics, traces, and alerts needed to understand a system in production — with SLIs, SLOs, dashboards, alert rules, and incident runbooks."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-observability
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
