name: performance-testing
description: "Design and execute performance tests — load, stress, soak, spike — to validate latency, throughput, and resource consumption under realistic conditions."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/qa-performance-testing
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
