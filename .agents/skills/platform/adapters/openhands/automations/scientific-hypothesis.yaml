name: scientific-hypothesis
description: "Formulate testable scientific hypotheses — null/alternative, variables, controls, falsifiability — with explicit variables and statistical plan."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/research-scientific-hypothesis
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
