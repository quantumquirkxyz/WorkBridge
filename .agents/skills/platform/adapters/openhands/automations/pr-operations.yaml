name: pr-operations
description: "Manage pull request operations with branch, diff, validation, reviewer, label, comment, and publication evidence while keeping merge decisions explicit."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/integrations-pr-operations
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
