name: frontend-design
description: "Shape frontend work into a clear visual system, interaction model, and implementation seam — with explicit state and motion boundaries."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/frontend-frontend-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
