name: service-mesh
description: "Service mesh (Istio, Linkerd, Cilium, mTLS, traffic splitting, observability)."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/backend-service-mesh
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
