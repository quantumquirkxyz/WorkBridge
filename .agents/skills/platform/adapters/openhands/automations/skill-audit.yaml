name: skill-audit
description: "Audit the Skills bundle, lockfile, symlink parity, and contract drift — with actionable maintenance output."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-audit
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-files]
