name: to-spec
description: "Turn the current conversation into a spec and publish it to the project issue tracker - no interview, just synthesis of what is already known."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/project-to-spec
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [create-issue]
