name: quant-credit-risk
description: "Model credit risk — PD, LGD, EAD, expected loss, loss distribution, credit VaR — with default correlation and portfolio-level risk aggregation."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/quant-quant-credit-risk
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
