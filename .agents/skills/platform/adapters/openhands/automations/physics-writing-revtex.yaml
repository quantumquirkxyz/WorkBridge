name: physics-writing-revtex
description: "Write physics papers using RevTeX / APS / IOP / AIP formatting, with figure conventions, citation styles, and submission package preparation."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/physics-physics-writing-revtex
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
