name: networking-security
description: "Design network security — segmentation, firewalls, VPNs, TLS, authentication, and threat boundaries — with explicit trust zones."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/networking-networking-security
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
