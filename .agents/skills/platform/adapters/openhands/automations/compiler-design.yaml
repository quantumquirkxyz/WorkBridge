name: compiler-design
description: "Design compiler pipelines — lexing, parsing, ASTs, type checking, IR, optimization, and code generation — with correctness and modularity."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/compilers-compiler-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
