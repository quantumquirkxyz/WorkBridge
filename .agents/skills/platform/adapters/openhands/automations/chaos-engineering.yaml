name: chaos-engineering
description: "Design chaos engineering — fault injection, GameDays, resilience validation — with explicit steady-state hypotheses, blast radius controls, and safety rails."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-chaos-engineering
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
