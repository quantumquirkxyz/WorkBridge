name: ai-ml-pipeline
description: "Design ML pipelines — data ingestion, preprocessing, training, evaluation, deployment, monitoring — with reproducibility, fairness, and version control."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-ai-ml-pipeline
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
