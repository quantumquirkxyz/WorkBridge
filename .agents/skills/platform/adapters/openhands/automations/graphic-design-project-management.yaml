name: graphic-design-project-management
description: "Manage graphic design projects — briefs, iterations, reviews, asset handoff, versioning, and delivery — with explicit scope, timelines, and quality gates."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/graphic-design-graphic-design-project-management
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
