name: cms-access-control
description: "Design CMS access control — roles, permissions, editorial workflows, and publishing boundaries — with explicit least-privilege and auditability."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cms-cms-access-control
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
