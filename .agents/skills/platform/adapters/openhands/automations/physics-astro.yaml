name: physics-astro
description: "Model astrophysical systems — stellar structure, orbital dynamics, cosmology, gravitational waves — with physical scales, order-of-magnitude estimates, and scaling laws."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/physics-physics-astro
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
