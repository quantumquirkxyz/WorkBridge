name: db-migrations
description: "Plan database migrations — schema changes, backfills, compatibility windows, and rollback strategy — with explicit application and data safety checks."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/db-db-migrations
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
