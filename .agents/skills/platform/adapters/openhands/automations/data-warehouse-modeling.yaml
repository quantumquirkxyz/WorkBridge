name: data-warehouse-modeling
description: "Design analytical warehouse schemas — star / snowflake / OBT — with dimension, fact, and bridge tables; partitioning; indexing; and query optimization."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-data-warehouse-modeling
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
