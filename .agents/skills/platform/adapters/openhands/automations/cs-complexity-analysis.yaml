name: cs-complexity-analysis
description: "Analyze algorithmic complexity — time, space, amortized cost, and lower bounds — with explicit assumptions and proof sketches."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cs-cs-complexity-analysis
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
