name: ship-subissue
description: "Use when a finished subissue already has a clean PR and you need to merge it, mark it as completed, and close the linked issue — with release discipline."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-ship-subissue
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [merge-pull-request, close-issue, update-project]
