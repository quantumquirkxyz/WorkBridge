name: cloud-security
description: "Cloud security (AWS, GCP, Azure, IAM, KMS, security groups, compliance, posture management)"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
