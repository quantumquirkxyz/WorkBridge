name: networking-protocols
description: "Analyze network protocols — packet formats, handshakes, congestion control, routing, and transport behavior — with explicit timing and failure assumptions."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/networking-networking-protocols
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
