name: math-optimization
description: "Formulate and solve optimization problems (linear, convex, non-convex, combinatorial) — model, choose solver, verify optimality, report sensitivity."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/math-math-optimization
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
