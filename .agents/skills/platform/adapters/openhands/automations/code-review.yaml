name: code-review
description: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes - Standards and Spec - and publish findings only."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-code-review
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [post-pr-comment]
