name: secret-management
description: "Design secret management — Vault, SOPS, SealedSecrets, rotation, external secrets — with encryption, access control, and auditability."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-secret-management
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
