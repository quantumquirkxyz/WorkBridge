name: rag-pipeline
description: "Design RAG pipelines — retrieval, chunking, embedding, reranking, generation — with explicit data flow, latency budgets, and evaluation seams."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-rag-pipeline
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
