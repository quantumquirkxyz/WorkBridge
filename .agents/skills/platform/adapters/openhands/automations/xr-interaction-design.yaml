name: xr-interaction-design
description: "Design XR interactions — spatial input, comfort, locomotion, hand tracking, and feedback — with clear constraints on immersion and usability."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/xr-xr-interaction-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
