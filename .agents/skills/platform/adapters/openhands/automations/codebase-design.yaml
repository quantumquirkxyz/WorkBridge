name: codebase-design
description: "Shared vocabulary for designing deep modules. Use when the user wants to design or improve a module's interface, find depth, or define a clean seam."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-codebase-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
