name: review-fix-loop
description: "Orchestrate the PR repair loop: run review-pr, use plan-review-fixes when findings exist, use implement-review-fixes to apply them, and repeat until the PR is clean or blocked. This skill coordinates the loop only."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-review-fix-loop
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-code, post-pr-comment, commit-git, push-branch]
