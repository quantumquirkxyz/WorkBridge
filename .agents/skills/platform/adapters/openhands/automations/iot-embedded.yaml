name: iot-embedded
description: "Design embedded/IoT systems — firmware, sensors, edge computing, device connectivity, OTA updates — with reliability, security, and constrained resource awareness."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/iot-iot-embedded
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
