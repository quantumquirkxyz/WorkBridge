name: skill-promoter
description: Promote validated experimental skills from the sandbox to the canonical skills bundle.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-promoter
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-files, create-symlink, update-lockfile]
