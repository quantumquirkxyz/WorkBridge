name: grill
description: "Alias for the quirk grilling flow. Use when the user says \"grill\" and wants a relentless interview to sharpen a plan, decision, or design."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-grill
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
