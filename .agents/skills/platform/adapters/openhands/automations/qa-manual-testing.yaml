name: qa-manual-testing
description: "Perform manual test sessions — exploratory checks, edge cases, accessibility, and user-visible regressions — with explicit reproduction notes."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/qa-qa-manual-testing
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
