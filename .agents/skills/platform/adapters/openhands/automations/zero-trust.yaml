name: zero-trust
description: "Design zero trust architecture — identity, per-request auth, microsegmentation, policy — with explicit trust tiers, continuous verification, and least-privilege enforcement."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/sec-zero-trust
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
