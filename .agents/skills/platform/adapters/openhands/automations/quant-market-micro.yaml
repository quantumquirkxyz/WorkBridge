name: quant-market-micro
description: "Analyse market microstructure — order book dynamics, price formation, execution costs (slippage, spread, impact), and optimal execution strategies."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/quant-quant-market-micro
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
