name: skill-tutor
description: Interactive tutorial that guides users through creating their first quirk skill using structured worksheets and hands-on
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-tutor
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
