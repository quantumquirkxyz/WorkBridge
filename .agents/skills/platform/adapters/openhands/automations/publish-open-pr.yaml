name: publish-open-pr
description: "Use when the user wants to publish a finished subissue as an open GitHub pull request from an already-prepared issue branch — with scoped, auditable publication."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-publish-open-pr
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [push-branch, create-pull-request]
