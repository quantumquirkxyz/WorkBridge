name: xr-performance
description: "Optimize XR performance — frame rate, motion-to-photon latency, asset budgets, and thermal constraints — with comfort-aware trade-offs."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/xr-xr-performance
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
