name: docs-management
description: "Keep repository documentation, ADRs, and durable context aligned with the current project shape — with explicit consumer rules."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/project-docs-management
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
