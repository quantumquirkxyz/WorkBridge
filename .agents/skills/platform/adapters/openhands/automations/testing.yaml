name: testing
description: Shape the test strategy for a project so behavior is verified at the right seams and at the right level.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-testing
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
