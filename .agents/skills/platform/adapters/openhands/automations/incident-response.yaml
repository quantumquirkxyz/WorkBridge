name: incident-response
description: "Design incident response — runbooks, war rooms, postmortems, blameless culture — with explicit severity taxonomy, escalation paths, and communication rules."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-incident-response
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
