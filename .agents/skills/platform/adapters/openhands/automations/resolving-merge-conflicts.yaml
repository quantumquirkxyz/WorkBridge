name: resolving-merge-conflicts
description: "Use when you need to resolve a conflicted or blocked branch state: in-progress git merge/rebase conflicts, PR branch corrections, or other branch-state blockers that need deliberate resolution."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-resolving-merge-conflicts
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-code, commit-git, continue-merge-or-rebase]
