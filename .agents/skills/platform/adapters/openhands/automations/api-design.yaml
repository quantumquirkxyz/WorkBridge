name: api-design
description: "Design a small, durable API seam — with a deep backend and explicit caller contract boundaries."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-api-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
