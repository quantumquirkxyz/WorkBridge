name: skill-testing-framework
description: "Validate Skill structure, contracts, dependencies, anti-patterns, and isolated execution — use when checking a Skill before promotion."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-testing-framework
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-files]
