name: evaluate-skill
description: "Evaluate a Skill against fixed scenarios for routing, completion, and artifact validity."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-evaluate-skill
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
