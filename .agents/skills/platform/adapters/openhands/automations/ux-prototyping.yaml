name: ux-prototyping
description: "Prototype user experiences — wireframes, interactive mockups, and rapid validation — with explicit experiment goals and iteration criteria."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ux-ux-prototyping
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
