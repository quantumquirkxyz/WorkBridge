name: rule-cataloger
description: "Extract and classify rules across Skills by type, frequency, and application area; use when auditing the repository's shared guidance."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-rule-cataloger
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
