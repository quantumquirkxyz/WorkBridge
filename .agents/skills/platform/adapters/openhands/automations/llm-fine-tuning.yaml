name: llm-fine-tuning
description: "Fine-tune LLMs — LoRA, QLoRA, full fine-tuning, data preparation, evaluation, deployment — with reproducibility, efficiency, and safety controls."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-llm-fine-tuning
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
