name: mcp-server
description: "Define an MCP server that exposes quirk Skills as tools, resources, and prompts to external LLM agents via the Model Context Protocol."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-mcp-server
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-files]
