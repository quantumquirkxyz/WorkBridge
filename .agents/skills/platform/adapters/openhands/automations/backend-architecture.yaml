name: backend-architecture
description: "Shape backend systems — REST/gRPC APIs, service contracts, data flow, state management, error handling — with explicit seams and caller responsibilities."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/backend-backend-architecture
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
