name: devops-terraform-iac
description: "Design infrastructure as code — Terraform / Pulumi / CloudFormation — for reproducible, version-controlled, auditable cloud infrastructure."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/devops-devops-terraform-iac
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
