name: styling
description: "Modern CSS (Tailwind v4, Panda CSS, CSS modules, CVA, design tokens)."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/frontend-styling
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
