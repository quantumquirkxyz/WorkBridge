name: implement
description: "Implement a piece of work based on a spec or set of tickets, or build a scoped fix that can be handed off for publication. This skill stops at the implemented, validated branch."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-implement
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-code, commit-git, push-branch]
