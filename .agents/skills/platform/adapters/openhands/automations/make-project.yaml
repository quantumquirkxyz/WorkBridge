name: make-project
description: "Use when the user wants a new board in GitHub Projects, or another skill needs one — create the project, wire its fields, and preserve tracker semantics."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/project-make-project
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [create-project, create-project-fields, link-repositories]
