name: design-system-visual
description: "Design visual design systems — tokens, components, patterns, and documentation — with explicit hierarchy, accessibility, and cross-channel consistency."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/graphic-design-design-system-visual
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
