name: review-pr
description: "Review a pull request against the fixed point the user supplies, separating Standards and Spec findings into distinct ax"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-review-pr
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [post-pr-comment]
