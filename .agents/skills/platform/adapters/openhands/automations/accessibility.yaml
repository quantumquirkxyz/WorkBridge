name: accessibility
description: "Design inclusive products — WCAG compliance, assistive technology support, keyboard navigation, color contrast — with explicit user access guarantees."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/accessibility-accessibility
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
