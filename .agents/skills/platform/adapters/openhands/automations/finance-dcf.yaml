name: finance-dcf
description: "Discounted Cash Flow — forecast, WACC, terminal value, sensitivity — with explicit assumptions, cross-check against multiples, and a valuation range."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/finance-finance-dcf
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
