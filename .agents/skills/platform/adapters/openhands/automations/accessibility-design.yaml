name: accessibility-design
description: "Design accessible interfaces — semantics, focus management, keyboard flows, contrast, and assistive-technology compatibility — with inclusive interaction patterns."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/accessibility-accessibility-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
