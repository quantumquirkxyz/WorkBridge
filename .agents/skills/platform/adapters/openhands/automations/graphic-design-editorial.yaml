name: graphic-design-editorial
description: "Design editorial layouts — magazines, books, reports, long-form content — with explicit grid systems, typography hierarchy, and production-ready pagination."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/graphic-design-graphic-design-editorial
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
