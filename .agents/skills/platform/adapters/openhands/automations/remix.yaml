name: remix
description: "Remix framework (loaders, actions, nested routes, progressive enhancement)."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/frontend-remix
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
