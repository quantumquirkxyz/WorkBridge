name: localization
description: "Design internationalization (i18n) and localization (l10n) — string management, locale handling, RTL support, cultural adaptation — so the product works across languages and regions."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/cms-localization
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
