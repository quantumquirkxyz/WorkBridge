name: agent-orchestration
description: "Design agent orchestration — multi-agent patterns, tool use, memory, handoffs, evaluation — with explicit coordination boundaries and observability."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-agent-orchestration
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
