name: implement-review-fixes
description: "Read a GitHub PR remediation plan produced by plan-review-fixes, implement the planned corrections through the repositor"
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-implement-review-fixes
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-code, commit-git, push-branch]
