name: grill-with-docs
description: "A relentless interview to sharpen a plan or design, while creating docs (ADRs and glossary) as we go."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-grill-with-docs
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: [write-docs]
