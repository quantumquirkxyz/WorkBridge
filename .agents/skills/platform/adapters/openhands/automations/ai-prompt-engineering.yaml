name: ai-prompt-engineering
description: "Design, evaluate, and refine prompts for LLMs (GPT-4, Claude, Llama, Mistral) with chain-of-thought, few-shot, RAG, and evaluation metrics."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ai-ai-prompt-engineering
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
