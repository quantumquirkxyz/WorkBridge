name: professional-project-management
description: "Manage professional projects — scope, milestones, risks, dependencies, and stakeholder alignment — with explicit planning and tracking artifacts."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/professional-professional-project-management
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
