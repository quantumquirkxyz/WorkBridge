name: data-streaming
description: "Design streaming data pipelines — Kafka, Kinesis, Pub/Sub, Flink — with event schemas, stream processing, and real-time analytics."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/data-data-streaming
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
