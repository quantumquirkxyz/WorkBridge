name: ask-to
description: Ask which skill or flow fits your situation. A router over the skills in this repo that recommends the next step after governance preflight.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/routing-ask-to
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
