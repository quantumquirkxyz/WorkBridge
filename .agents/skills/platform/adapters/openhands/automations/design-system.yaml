name: design-system
description: "Define and evolve reusable UI tokens, components, and usage rules as a coherent system."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/frontend-design-system
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
