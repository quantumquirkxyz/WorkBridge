name: prod-okr-planning
description: "Design OKR cycles — Objectives, Key Results, initiatives — with measurable outcomes, quarterly cadences, and team alignment."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/product-prod-okr-planning
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
