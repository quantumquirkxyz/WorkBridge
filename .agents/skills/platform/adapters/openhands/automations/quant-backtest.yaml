name: quant-backtest
description: "Run a backtest with full audit hygiene — biases, costs, out-of-sample, regime splits — and produce a verdict on whether a strategy is robust."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/quant-quant-backtest
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
