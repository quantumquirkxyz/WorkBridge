name: plan-review-fixes
description: Convert review-pr findings on a GitHub PR into a concrete remediation plan and post that plan as PR comments. Use after
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-plan-review-fixes
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [post-pr-comment]
