name: interaction-design
description: "Design user interactions — task flows, screen states, transitions, error states, feedback patterns — so the interface guides users predictably."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/ux-interaction-design
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
