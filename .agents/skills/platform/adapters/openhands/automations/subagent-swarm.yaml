name: subagent-swarm
description: "Coordinate multiple agent sub-roles (architect, implementer, reviewer, tester) in parallel or sequential swarm mode, with clear handoff contracts and evidence recording."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/foundation-subagent-swarm
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
