name: qa-automation
description: "Design and implement automated test suites — unit, integration, e2e — with proper coverage, maintainability, and CI integration."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/qa-qa-automation
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
