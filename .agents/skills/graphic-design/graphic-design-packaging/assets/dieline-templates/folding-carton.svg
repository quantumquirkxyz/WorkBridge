<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <title>Folding Carton Dieline - Regular Slotted Container</title>
  <desc>
    Cut line (red solid), fold lines (blue dashed), glue tab (green solid),
    bleed boundary (magenta long dashed), safety zone (orange dotted),
    registration marks (black).
  </desc>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="600" height="500" fill="url(#grid)"/>

  <!-- Bleed boundary (outermost) -->
  <rect x="40" y="40" width="520" height="420" fill="none" stroke="#ff00ff" stroke-width="0.5" stroke-dasharray="8 4"/>

  <!-- Cut line -->
  <rect x="60" y="60" width="480" height="380" fill="none" stroke="#ff0000" stroke-width="1.5"/>

  <!-- Safety zone (5mm inside cut line) -->
  <rect x="65" y="65" width="470" height="370" fill="none" stroke="#ffaa00" stroke-width="0.75" stroke-dasharray="3 3"/>

  <!-- Fold lines -->
  <!-- Main vertical folds -->
  <line x1="180" y1="60" x2="180" y2="440" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>
  <line x1="300" y1="60" x2="300" y2="440" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>
  <line x1="420" y1="60" x2="420" y2="440" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>

  <!-- Top and bottom folds for dust flaps -->
  <line x1="60" y1="160" x2="540" y2="160" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>
  <line x1="60" y1="340" x2="540" y2="340" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>

  <!-- Glue tab (left side) -->
  <rect x="30" y="160" width="30" height="180" fill="none" stroke="#00aa00" stroke-width="1"/>

  <!-- Registration marks (outside bleed) -->
  <g stroke="#000000" stroke-width="0.5">
    <!-- Top-left -->
    <line x1="20" y1="20" x2="40" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="40" y1="20" x2="40" y2="28"/>
    <line x1="20" y1="40" x2="28" y2="40"/>
    <!-- Top-right -->
    <line x1="560" y1="20" x2="580" y2="20"/>
    <line x1="580" y1="20" x2="580" y2="40"/>
    <line x1="560" y1="40" x2="560" y2="28"/>
    <line x1="580" y1="40" x2="572" y2="40"/>
    <!-- Bottom-left -->
    <line x1="20" y1="460" x2="40" y2="460"/>
    <line x1="20" y1="460" x2="20" y2="480"/>
    <line x1="40" y1="480" x2="40" y2="472"/>
    <line x1="20" y1="480" x2="28" y2="480"/>
    <!-- Bottom-right -->
    <line x1="560" y1="460" x2="580" y2="460"/>
    <line x1="580" y1="460" x2="580" y2="480"/>
    <line x1="560" y1="480" x2="560" y2="472"/>
    <line x1="580" y1="480" x2="572" y2="480"/>
  </g>

  <!-- Labels -->
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">BACK</text>
  <text x="210" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">LEFT</text>
  <text x="330" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">FRONT</text>
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">RIGHT</text>
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">GLUE TAB</text>

  <!-- Legend -->
  <g transform="translate(60, 460)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#ff0000" stroke-width="1.5"/>
    <text x="45" y="4" font-family="Arial, sans-serif" font-size="10" fill="#333">Cut line</text>

    <line x1="0" y1="15" x2="40" y2="15" stroke="#0066ff" stroke-width="0.75" stroke-dasharray="6 4"/>
    <text x="45" y="19" font-family="Arial, sans-serif" font-size="10" fill="#333">Fold line</text>

    <line x1="0" y1="30" x2="40" y2="30" stroke="#00aa00" stroke-width="1"/>
    <text x="45" y="34" font-family="Arial, sans-serif" font-size="10" fill="#333">Glue tab</text>

    <line x1="0" y1="45" x2="40" y2="45" stroke="#ff00ff" stroke-width="0.5" stroke-dasharray="8 4"/>
    <text x="45" y="49" font-family="Arial, sans-serif" font-size="10" fill="#333">Bleed</text>

    <line x1="0" y1="60" x2="40" y2="60" stroke="#ffaa00" stroke-width="0.75" stroke-dasharray="3 3"/>
    <text x="45" y="64" font-family="Arial, sans-serif" font-size="10" fill="#333">Safety zone</text>
  </g>
</svg>
