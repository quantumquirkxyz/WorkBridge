<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Ad Template</title>
  <style>
    :root {
      --brand-primary: #2563eb;
      --brand-secondary: #1e40af;
      --brand-accent: #f59e0b;
      --brand-neutral: #ffffff;
      --brand-text: #0f172a;
      --brand-text-light: #475569;
      --font-display: "Helvetica Neue", Arial, sans-serif;
      --font-body: "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .ad {
      width: 728px;
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border: 1px solid #e2e8f0;
      position: relative;
    }
    .left-block {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 64px;
      height: 32px;
      background: #2563eb;
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .message {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .headline {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .subhead {
      font-size: 13px;
      color: #475569;
      line-height: 1.35;
    }
    .cta-button {
      background: #f59e0b;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="left-block">
      <div class="logo">BRAND</div>
      <div class="message">
        <div class="headline">Launch Campaigns Faster</div>
        <div class="subhead">Enterprise-grade ad automation with built-in brand governance.</div>
      </div>
    </div>
    <a href="#" class="cta-button">Get Started</a>
  </div>
</body>
</html>
